<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>COSMOS:Juego de cartas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Honk:MORF@15&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/estilosPartida.css">
    <link rel="stylesheet" href="../css/estilosSistemaSolar.css">
</head>

<body>
    <a href="menuPrincipal.html">
        <button id="botonVolver">Volver</button>
    </a>

    <div id="botones">
        <a>
            <button id="botonVerSistema">Sistemas solares</button>
        </a>

        <a>
            <button id="botonBatallaEstrellas">Batalla de estrellas</button>
        </a>
    </div>

    <a>
        <button id="botonSiguienteTurno">Siguiente turno</button>
    </a>
    

    <div id="titulo">
        <h1 id="encabezado">
            PARTIDA
        </h1>
    </div>

    <div id="superior">
        <div id="sistema-solar" img="../imagenes/estrellaAmarilla.png">
                <!-- Órbita 0: Sol -->
            <div class="cuerpo-celeste sol" data-orbita="0">
                <div class="hueco-carta-sistema" id="hueco-sol"></div>
                <span class="nombre">Sol</span>
                <span class="numero-orbita">Órbita 0</span>
            </div>

            <!-- Órbita 1: Mercurio -->
            <div class="cuerpo-celeste planeta1" data-orbita="1">
                <div class="hueco-carta-sistema" id="hueco-planeta1"></div>
                <span class="nombre">Mercurio</span>
                <span class="numero-orbita">Órbita 1</span>
            </div>

            <!-- Órbita 2: Venus -->
            <div class="cuerpo-celeste planeta2" data-orbita="2">
                <div class="hueco-carta-sistema" id="hueco-planeta2"></div>
                <span class="nombre">Venus</span>
                <span class="numero-orbita">Órbita 2</span>
            </div>

            <!-- Órbita 3: Tierra -->
            <div class="cuerpo-celeste planeta3" data-orbita="3">
                <div class="hueco-carta-sistema" id="hueco-planeta3"></div>
                <span class="nombre">Tierra</span>
                <span class="numero-orbita">Órbita 3</span>
            </div>

            <!-- Órbita 4: Marte -->
            <div class="cuerpo-celeste planeta4" data-orbita="4">
                <div class="hueco-carta-sistema" id="hueco-planeta4"></div>
                <span class="nombre">Marte</span>
                <span class="numero-orbita">Órbita 4</span>
            </div>

            <!-- Órbita 5: Júpiter -->
            <div class="cuerpo-celeste planeta5" data-orbita="5">
                <div class="hueco-carta-sistema" id="hueco-planeta5"></div>
                <span class="nombre">Júpiter</span>
                <span class="numero-orbita">Órbita 5</span>
            </div>

            <!-- Órbita 6: Saturno -->
            <div class="cuerpo-celeste planeta6" data-orbita="6">
                <div class="hueco-carta-sistema" id="hueco-planeta6"></div>
                <span class="nombre">Saturno</span>
                <span class="numero-orbita">Órbita 6</span>
            </div>

            <!-- Órbita 7: Urano -->
            <div class="cuerpo-celeste planeta7" data-orbita="7">
                <div class="hueco-carta-sistema" id="hueco-planeta7"></div>
                <span class="nombre">Urano</span>
                <span class="numero-orbita">Órbita 7</span>
            </div>

            <!-- Órbita 8: Neptuno -->
            <div class="cuerpo-celeste planeta8" data-orbita="8">
                <div class="hueco-carta-sistema" id="hueco-planeta8"></div>
                <span class="nombre">Neptuno</span>
                <span class="numero-orbita">Órbita 8</span>
            </div>
            </div>


            <div id="errantes">
                <div id="imagen-errantes">
                    <p id="tituloErrantes">ERRANTES</p>
                    <div class="fila-errantes" id="fila-errantes-1">
                        <div class="errante" id="errante1"></div>
                        <div class="errante" id="errante2"></div>
                    </div>
                    
                    <div class="fila-errantes" id="fila-errantes-2">
                        <div class="errante" id="errante3"></div>
                        <div class="errante" id="errante4"></div>
                    </div>
                    
                </div>
        </div>
    </div>

    <div id="inferior">

        <div id="cartaCombate"></div>

        <div id = "baraja">
            <img draggable="true" id="imgBaraja" src="../imagenes/Base_Carta_Cosmos.png"> 
        </div>

    </div>

    <div id="cartasJugador">
        <button id="botonCartas">▼</button>


        <div id = "filaCartas">
            <div class="carta" id="carta1" >
                <img  draggable="true" class="imgCarta" id="imgCarta1">
            </div>

            <div class="carta" id="carta2" >
                <img  draggable="true" class="imgCarta" id="imgCarta2">
            </div>

            <div class="carta" id="carta3" >
                <img  draggable="true"  class="imgCarta" id="imgCarta3">
            </div>

            <div class="carta" id="carta4" >
                <img  draggable="true"  class="imgCarta" id="imgCarta4">
            </div>

            <div class="carta" id="carta5" >
                <img  draggable="true"  class="imgCarta" id="imgCarta5">
            </div>

            <div class="carta" id="carta6" >
                <img  draggable="true"  class="imgCarta" id="imgCarta6">
            </div>

            <div class="carta" id="carta7" >
                <img  draggable="true" class="imgCarta" id="imgCarta7">
            </div>
        </div> 

        <button id="botonSiguientesCartas">-</button>

    </div>

    <div id="panelSistemaSolar" class="oculto">
        <h2>SISTEMAS SOLARES</h2>
        <h3>Cartas del sistema solar del otro jugador:</h3>
    </div>

    <div id="panelErrantes" class="oculto">
    </div>

    <div id="panelCombate" class="oculto">
    </div>

    <div id="panelCartas" class="oculto">
    </div>


    <script type="module" src="../js/moverCartas.js"></script>
    <script type="module"src="../js/elementosHtml.js"></script>
    <script  type="module" src="../js/interfazCartas.js"></script>
    <script  type="module" src="../js/accionesJugador.js"></script>
</body>
